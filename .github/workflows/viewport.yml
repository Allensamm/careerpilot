name: CareerPilot responsive browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for CI only
        run: npm install --no-save playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start test web server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/careerpilot-ui.log 2>&1 &
          sleep 2
      - name: Check real desktop, tablet, and mobile viewports
        run: node tests/viewport.mjs
