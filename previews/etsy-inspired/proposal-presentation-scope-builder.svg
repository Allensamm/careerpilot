<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-label="Proposal Presentation &amp; Scope Builder guided worksheet interior page"><rect width="720" height="900" fill="#eef1f5"/><rect x="24" y="18" width="672" height="864" rx="4" fill="#ffffff" stroke="#d8e0e9"/><rect x="24" y="18" width="9" height="864" fill="#f07845"/><text x="66" y="67" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">CAREERPILOT DIGITAL  /  FREELANCE &amp; CLIENT WORK</text><text x="66" y="105" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c56b45">GUIDED WORKSHEET  /  PAGE 04</text><text x="72" y="154" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#101827">Proposal Presentation &amp; Scope</text><text x="72" y="197" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#101827">Builder</text><text x="66" y="267" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Use these prompts to turn the plan into specific decisions and next actions.</text><rect x="66" y="287" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="316" r="14" fill="#f07845"/><text x="92" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">1</text><text x="104" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">What problem is the proposal solving?</text><line x1="104" y1="371" x2="620" y2="371" stroke="#cbd4df"/><line x1="104" y1="388" x2="620" y2="388" stroke="#cbd4df"/><rect x="66" y="417" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="446" r="14" fill="#f07845"/><text x="92" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">2</text><text x="104" y="465" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">Which deliverables are included and how will completion</text><text x="104" y="485" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">be judged?</text><line x1="104" y1="501" x2="620" y2="501" stroke="#cbd4df"/><line x1="104" y1="518" x2="620" y2="518" stroke="#cbd4df"/><rect x="66" y="547" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="576" r="14" fill="#f07845"/><text x="92" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">3</text><text x="104" y="595" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">What does the client need to supply or approve?</text><line x1="104" y1="631" x2="620" y2="631" stroke="#cbd4df"/><line x1="104" y1="648" x2="620" y2="648" stroke="#cbd4df"/><rect x="66" y="677" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="706" r="14" fill="#f07845"/><text x="92" y="711" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">4</text><text x="104" y="725" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">Which assumptions could change scope or timing?</text><line x1="104" y1="761" x2="620" y2="761" stroke="#cbd4df"/><line x1="104" y1="778" x2="620" y2="778" stroke="#cbd4df"/><line x1="66" y1="842" x2="654" y2="842" stroke="#e1e6ed"/><text x="66" y="865" font-family="Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#8291a3">PRINT  /  ANNOTATE  /  REPEAT</text><text x="654" y="865" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#8291a3">CP-260</text></svg>