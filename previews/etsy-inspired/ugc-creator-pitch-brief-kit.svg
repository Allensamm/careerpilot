<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-label="UGC Creator Pitch &amp; Brief Kit guided worksheet interior page"><rect width="720" height="900" fill="#eef1f5"/><rect x="24" y="18" width="672" height="864" rx="4" fill="#ffffff" stroke="#d8e0e9"/><rect x="24" y="18" width="9" height="864" fill="#f07845"/><text x="66" y="67" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">CAREERPILOT DIGITAL  /  CREATOR &amp; DIGITAL PRODUCTS</text><text x="66" y="105" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c56b45">GUIDED WORKSHEET  /  PAGE 04</text><text x="72" y="154" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#101827">UGC Creator Pitch &amp; Brief Kit</text><text x="66" y="224" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Use these prompts to turn the plan into specific decisions and next actions.</text><rect x="66" y="244" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="273" r="14" fill="#f07845"/><text x="92" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">1</text><text x="104" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">Which content format best demonstrates your strengths?</text><line x1="104" y1="328" x2="620" y2="328" stroke="#cbd4df"/><line x1="104" y1="345" x2="620" y2="345" stroke="#cbd4df"/><rect x="66" y="374" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="403" r="14" fill="#f07845"/><text x="92" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">2</text><text x="104" y="422" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">What brand problem could your sample help solve?</text><line x1="104" y1="458" x2="620" y2="458" stroke="#cbd4df"/><line x1="104" y1="475" x2="620" y2="475" stroke="#cbd4df"/><rect x="66" y="504" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="533" r="14" fill="#f07845"/><text x="92" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">3</text><text x="104" y="552" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">What usage rights and deliverables must be clarified?</text><line x1="104" y1="588" x2="620" y2="588" stroke="#cbd4df"/><line x1="104" y1="605" x2="620" y2="605" stroke="#cbd4df"/><rect x="66" y="634" width="588" height="115" rx="5" fill="#fbfcfd" stroke="#dfe5ec"/><circle cx="92" cy="663" r="14" fill="#f07845"/><text x="92" y="668" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#101827">4</text><text x="104" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#26384d">What should the client confirm before production begins?</text><line x1="104" y1="718" x2="620" y2="718" stroke="#cbd4df"/><line x1="104" y1="735" x2="620" y2="735" stroke="#cbd4df"/><line x1="66" y1="842" x2="654" y2="842" stroke="#e1e6ed"/><text x="66" y="865" font-family="Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#8291a3">PRINT  /  ANNOTATE  /  REPEAT</text><text x="654" y="865" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#8291a3">CP-295</text></svg>